name: Build WebGL and Addressables

on:
  pull_request:
    branches: [master]
    paths:
      - 'Assets/**'
  push:
    branches: [master]
    paths:
      - 'Assets/**'
  workflow_dispatch:

concurrency:
  group: build-webgl-addressables-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-webgl-and-addressables:
    uses: ./.github/workflows/unity-ci-reusable.yml
    secrets: inherit
    with:
      build_webgl: true
      build_addressables: true
      deploy_webgl: ${{ github.event_name != 'pull_request' }}
      upload_addressables: ${{ github.event_name != 'pull_request' }}
